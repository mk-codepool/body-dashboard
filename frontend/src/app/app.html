<div class="app-layout">
  <!-- Minimalist Top Bar -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="brand">
        <div class="brand-symbol">
          <span class="symbol-dot"></span>
        </div>
        <div class="brand-text">
          <span class="brand-title">BODY</span>
          <span class="brand-subtitle">DASHBOARD</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="status-indicator">
        <span class="pulse-dot"></span>
        <span class="status-label">SYSTEM ONLINE</span>
      </div>
    </div>

    <div class="top-bar-center">
      <nav class="nav-links">
        <button class="nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
          </svg>
          <span>Pulpit</span>
        </button>
      </nav>
    </div>

    <div class="top-bar-right">
      <!-- Przełącznik trybu edycji dashboardu -->
      <div class="layout-controls">
        @if (layoutService.isEditMode()) {
          <button 
            type="button"
            class="layout-btn btn-reset"
            (click)="layoutService.resetToDefault()"
            title="Przywróć domyślny układ kafelków">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            <span>Resetuj</span>
          </button>
        }

        <button 
          type="button"
          class="layout-btn btn-edit-toggle"
          [class.active]="layoutService.isEditMode()"
          (click)="layoutService.toggleEditMode()"
          [title]="layoutService.isEditMode() ? 'Zakończ tryb edycji kafelków' : 'Włącz przeciąganie i skalowanie kafelków'">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            @if (layoutService.isEditMode()) {
              <path d="M20 6L9 17l-5-5" />
            } @else {
              <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.375 2.625a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z" />
            }
          </svg>
          <span>{{ layoutService.isEditMode() ? 'Gotowe' : 'Dostosuj pulpit' }}</span>
          @if (layoutService.isEditMode()) {
            <span class="edit-badge-dot"></span>
          }
        </button>
      </div>

      <div class="divider"></div>

      <div class="time-widget">
        <span class="time-value">{{ currentTime() }}</span>
        <span class="date-value">{{ currentDate() }}</span>
      </div>
    </div>
  </header>

  <!-- Main Content Space (Dashboard) -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
