services:
  # =======================================================
  # 1. BACKEND API (NestJS Web Service)
  # =======================================================
  - type: web
    name: body-dashboard-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Wrażliwe sekrety OAuth - wartości definiowane bezpośrednio w panelu Render.com:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # =======================================================
  # 2. FRONTEND SPA (Angular Static Site)
  # =======================================================
  - type: web
    name: body-dashboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      # Obsługa routingu Angular Single Page Application
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
